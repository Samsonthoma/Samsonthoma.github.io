<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>
    .bg { fill: #080b14; }
    .border { stroke: rgba(255, 255, 255, 0.15); }
    .text { fill: #ffffff; }
    .dot { fill: #77d5ff; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f8fafc; }
      .border { stroke: rgba(15, 23, 42, 0.15); }
      .text { fill: #0f172a; }
      .dot { fill: #0284c7; }
    }
  </style>

  <!-- Container Box -->
  <rect width="512" height="512" rx="128" class="bg" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" class="border" stroke-width="16" />

  <!-- Brand Text ST. -->
  <text x="210" y="335" class="text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="230" text-anchor="middle" letter-spacing="-12">ST</text>
  <circle cx="355" cy="315" r="28" class="dot" />
</svg>
